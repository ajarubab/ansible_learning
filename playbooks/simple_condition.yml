# NodeB : httpd :  Installed, Active and Enabled , nginx : not-installed
# NodeC : httpd :  not-installed , nginx : Installed, Inactive and Disabled

#Expected Output:

# NodeA : httpd :  nginx : Installed, Active and Enabled [CHANGED]
# NodeB : httpd :  nginx : not-installed [Skipping]
# NodeC : httpd :  nginx : Installed, Inactive and Disabled [OK]

