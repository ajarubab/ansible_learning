[defaults]
inventory = ./inventory
remote_user = student
# ask_pass = false
roles_path = ./playbooks/roles:/usr/share/ansible/roles
collections_path = ./playbooks/mycollections:/usr/share/ansible/collections

[privilege_escalation]
# become = true
